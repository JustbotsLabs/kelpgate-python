name: Publish

# Push a tag such as v0.1.0 to publish that version to PyPI. Uses PyPI Trusted Publishing (no stored token):
# on pypi.org, add this repository and the workflow name "publish.yml" with environment "pypi" as a trusted publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: The tag must match the package version
        run: |
          version="$(python -c "exec(open('src/kelpgate/_version.py').read()); print(__version__)")"
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

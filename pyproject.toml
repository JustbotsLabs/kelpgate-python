[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kelpgate-client"
dynamic = ["version"]
description = "Kelpgate Client for Python: scan files and URLs for malware with the Kelpgate API, sync or async, with a CLI and FastAPI and Django helpers."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kelpgate" }]
keywords = ["kelpgate", "malware", "antivirus", "virus-scan", "clamav", "yara", "upload", "fastapi", "django"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
django = ["django>=4.2"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "fastapi>=0.100",
  "python-multipart>=0.0.9",
  "django>=4.2",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
kelpgate = "kelpgate.cli:main"

[project.urls]
Homepage = "https://kelpgate.cloud"
Documentation = "https://kelpgate.cloud/guides/"
Repository = "https://github.com/KelpGate/kelpgate-python"
Issues = "https://github.com/KelpGate/kelpgate-python/issues"
Changelog = "https://github.com/KelpGate/kelpgate-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/kelpgate/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kelpgate"]

[tool.hatch.build.targets.sdist]
include = ["src/kelpgate", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
extend-exclude = ["*.md"]
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
strict = true
files = ["src/kelpgate"]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true
